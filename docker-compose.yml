services:
  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: identity-service
    ports:
      - "${IDENTITY_SERVICE_PORT}:8086"
    environment:
      - IDENTITY_DB_USER=${IDENTITY_DB_USER}
      - IDENTITY_DB_PASSWORD=${IDENTITY_DB_PASSWORD}
      - IDENTITY_DB_PORT=5432
      - IDENTITY_DB_HOST=identity-db
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - AWS_REGION=${AWS_REGION}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
    depends_on:
      identity-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - pantry-network

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "${USER_SERVICE_PORT}:8085"
    environment:
      - USER_DB_USER=${USER_DB_USER}
      - USER_DB_PASSWORD=${USER_DB_PASSWORD}
      - USER_DB_PORT=5432
      - USER_DB_HOST=user-db
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - AWS_REGION=${AWS_REGION}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - pantry-network

  interaction-service:
    build:
      context: ./services/interaction-service
      dockerfile: Dockerfile
    container_name: interaction-service
    ports:
      - "${INTERACTION_SERVICE_PORT}:8082"
    environment:
      - INTERACTION_DB_USER=${INTERACTION_DB_USER}
      - INTERACTION_DB_PASSWORD=${INTERACTION_DB_PASSWORD}
      - INTERACTION_DB_PORT=5432
      - INTERACTION_DB_HOST=interaction-db
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - AWS_REGION=${AWS_REGION}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
    depends_on:
      interaction-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - pantry-network

  recipe-service:
    build:
      context: ./services/recipe-service
      dockerfile: Dockerfile
    container_name: recipe-service
    ports:
      - "${RECIPE_SERVICE_PORT}:8083"
    environment:
      - RECIPE_DB_USER=${RECIPE_DB_USER}
      - RECIPE_DB_PASSWORD=${RECIPE_DB_PASSWORD}
      - RECIPE_DB_PORT=5432
      - RECIPE_DB_HOST=recipe-db
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - USER_SERVICE_PORT=${USER_SERVICE_PORT}
      - USER_SERVICE_HOST=${USER_SERVICE_HOST}
      - AWS_REGION=${AWS_REGION}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
    depends_on:
      recipe-db:
        condition: service_healthy
    networks:
      - pantry-network

  recommendation-service:
    build:
      context: ./services/recommendation-service
      dockerfile: Dockerfile
    container_name: recommendation-service
    ports:
      - "${RECOMMENDATION_SERVICE_PORT}:8084"
    environment:
      - RECOMMENDATION_DB_USER=${RECOMMENDATION_DB_USER}
      - RECOMMENDATION_DB_PASSWORD=${RECOMMENDATION_DB_PASSWORD}
      - RECOMMENDATION_DB_PORT=5432
      - RECOMMENDATION_DB_HOST=recommendation-db
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      recommendation-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - pantry-network

  semantic-search-service:
    build:
      context: ./services/semantic-search-service
      dockerfile: Dockerfile
    container_name: semantic-search-service
    ports:
      - "${SEMANTIC_SEARCH_SERVICE_PORT}:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    volumes:
      - ./services/semantic-search-service/data:/app/data
    depends_on:
      kafka:
        condition: service_started
    networks:
      - pantry-network

  ai-agent-service:
    build:
      context: ./services/ai-agent-service
      dockerfile: Dockerfile
    container_name: ai-agent-service
    ports:
      - "${AI_AGENT_SERVICE_PORT}:8006"
    environment:
      - AI_AGENT_DB_USER=${AI_AGENT_DB_USER}
      - AI_AGENT_DB_PASSWORD=${AI_AGENT_DB_PASSWORD}
      - AI_AGENT_DB_PORT=5432
      - AI_AGENT_DB_HOST=ai-agent-db
      - SEMANTIC_SEARCH_SERVICE_URL=http://${SEMANTIC_SEARCH_SERVICE_HOST}:${SEMANTIC_SEARCH_SERVICE_PORT}
      - RECIPE_SERVICE_URL=http://${RECIPE_SERVICE_HOST}:${RECIPE_SERVICE_PORT}
      - OLLAMA_HOST=${OLLAMA_HOST}:${OLLAMA_PORT}
    depends_on:
      semantic-search-service:
        condition: service_started
      ollama:
        condition: service_started
      ai-agent-db:
        condition: service_healthy
    networks:
      - pantry-network

  feedback-pipeline:
    image: pantry-pipeline-builder:latest
    container_name: feedback-pipeline
    build:
      context: ./services/feedback-pipeline
      dockerfile: Dockerfile
    depends_on:
      flink-jobmanager:
        condition: service_started
      kafka-flink:
        condition: service_completed_successfully
    environment:
      - KAFKA_BROKERS=${KAFKA_BOOTSTRAP_SERVERS}
    command: >
      flink run
      -m flink-jobmanager:${FLINK_PORT}
      -c com.pantry.InteractionCleaner
      /opt/flink/usrlib/app.jar
      --kafka.brokers ${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - pantry-network

  identity-db:
    image: postgres:15-alpine
    container_name: identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: ${IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD}
    ports:
      - "${IDENTITY_DB_PORT}:5432"
    networks:
      - pantry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER} -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:15-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_DB_PORT}:5432"
    networks:
      - pantry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  recipe-db:
    image: postgres:15-alpine
    container_name: recipe-db
    environment:
      POSTGRES_DB: recipe_db
      POSTGRES_USER: ${RECIPE_DB_USER}
      POSTGRES_PASSWORD: ${RECIPE_DB_PASSWORD}
    ports:
      - "${RECIPE_DB_PORT}:5432"
    networks:
      - pantry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RECIPE_DB_USER} -d recipe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  interaction-db:
    image: postgres:15-alpine
    container_name: interaction-db
    environment:
      POSTGRES_DB: interaction_db
      POSTGRES_USER: ${INTERACTION_DB_USER}
      POSTGRES_PASSWORD: ${INTERACTION_DB_PASSWORD}
    ports:
      - "${INTERACTION_DB_PORT}:5432"
    networks:
      - pantry-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${INTERACTION_DB_USER} -d interaction_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  recommendation-db:
    image: postgres:15-alpine
    container_name: recommendation-db
    environment:
      POSTGRES_DB: recommendation_db
      POSTGRES_USER: ${RECOMMENDATION_DB_USER}
      POSTGRES_PASSWORD: ${RECOMMENDATION_DB_PASSWORD}
    ports:
      - "${RECOMMENDATION_DB_PORT}:5432"
    networks:
      - pantry-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${RECOMMENDATION_DB_USER} -d recommendation_db",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-agent-db:
    image: postgres:15-alpine
    container_name: ai-agent-db
    environment:
      POSTGRES_DB: ai_agent_db
      POSTGRES_USER: ${AI_AGENT_DB_USER}
      POSTGRES_PASSWORD: ${AI_AGENT_DB_PASSWORD}
    ports:
      - "${AI_AGENT_DB_PORT}:5432"
    networks:
      - pantry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_AGENT_DB_USER} -d ai_agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT}
    networks:
      - pantry-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_BOOTSTRAP_SERVERS},PLAINTEXT_HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - pantry-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: localhost
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - pantry-network

  kafka-flink:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-flink
    depends_on:
      - kafka
    entrypoint: ["sh", "-c"]
    command: |
      "
      cub kafka-ready -b ${KAFKA_BOOTSTRAP_SERVERS} 1 30

      kafka-topics --create --if-not-exists --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --partitions 3 --replication-factor 1 --topic interactions.pantry.raw
      kafka-topics --create --if-not-exists --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --partitions 3 --replication-factor 1 --topic interactions.pantry.cleaned
      kafka-topics --create --if-not-exists --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --partitions 3 --replication-factor 1 --topic interactions.pantry.errors

      echo 'topics created successfully'
      "
    networks:
      - pantry-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - pantry-network

  flink-jobmanager:
    image: flink:1.18-scala_2.12
    container_name: jobmanager
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    ports:
      - "${FLINK_PORT}:8090"
      - "${METRICS_FLINK_JOBMANAGER_PORT}:${METRICS_PORT}"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.bind-address: 0.0.0.0
        rest.port: ${FLINK_PORT}
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: ${METRICS_PORT}
    command: jobmanager
    networks:
      - pantry-network

  flink-taskmanager:
    image: flink:1.18-scala_2.12
    container_name: taskmanager
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - ./pantry-metadata:/opt/pantry/metadata
    depends_on:
      - flink-jobmanager
    ports:
      - "${METRICS_FLINK_TASKMANAGER_PORT}:${METRICS_PORT}"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: ${METRICS_PORT}
    command: taskmanager
    networks:
      - pantry-network

  retrain-worker:
    volumes:
      - ./pantry-metadata:/opt/pantry/metadata

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - pantry-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
    networks:
      - pantry-network

networks:
  pantry-network:
    driver: bridge

volumes:
  flink-checkpoints:
